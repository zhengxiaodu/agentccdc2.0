# 大模型配置文件
# 所有模型配置从这里读取，不通过 API 接口配置

models:
  default:
    provider: "openai"
    model_name: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"
    parameters:
      temperature: 0.3
      max_tokens: 4096

  # 可以配置多个模型
  qwen:
    provider: "dashscope"
    model_name: "qwen3-max"
    api_key_env: "DASHSCOPE_API_KEY"
    parameters:
      temperature: 0.5

# Agent 配置
agent:
  name: "AI问答助手"
  system_prompt: |
    你是一个智能助手，能够理解用户意图并调用相应的工具来完成任务。
    
    可用工具：
    1. bocha_search - 博查搜索：用于获取网上的最新知识和信息
    
    请根据用户的问题，判断是否需要调用工具：
    - 如果问题需要最新信息或实时数据，请调用搜索工具
    - 如果问题是常识性问题或不需要外部信息，可以直接回答
    
    请用自然、友好的语言回答用户的问题。